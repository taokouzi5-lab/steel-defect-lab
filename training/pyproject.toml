[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steel-defect-lab-training"
version = "0.1.0"
description = "Training pipeline for the DefectLens steel surface defect detection platform"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "numpy>=1.24",
    "Pillow>=9.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "bandit>=1.7",
]

[tool.setuptools.packages.find]
include = ["steel_training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "slow: long-running tests (GPU overfit smoke, real weight loading)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Scripts bootstrap sys.path before importing the sibling package.
"scripts/*.py" = ["E402"]
