name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PyTorch CPU wheels
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install training package with dev extras
        # Aliyun mirror for speed in mainland China; PyPI as fallback source.
        run: pip install -e "training/.[dev]" --index-url https://mirrors.aliyun.com/pypi/simple/ --extra-index-url https://pypi.org/simple/

      - name: Lint with ruff
        run: ruff check training

      - name: "Security scan with bandit (-ll: low severity and above)"
        run: bandit -r training/steel_training training/scripts -ll -q

      - name: Tests (CPU-only; GPU smoke test skipped)
        run: pytest training/tests -q -m "not slow" --cov=steel_training --cov-report=term-missing --cov-fail-under=60

  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyTorch CPU wheels
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install backend with dev extras
        # Aliyun mirror for speed in mainland China; PyPI as fallback source.
        run: pip install -e "backend/.[dev]" --index-url https://mirrors.aliyun.com/pypi/simple/ --extra-index-url https://pypi.org/simple/

      - name: Lint with ruff
        run: ruff check backend

      - name: "Security scan with bandit (-ll: low severity and above)"
        run: bandit -r backend/app -ll -q

      - name: Tests (CPU-only; artifact-dependent tests skip)
        run: cd backend && pytest tests -q -m "not slow" --cov=app --cov-report=term-missing --cov-fail-under=70

  docker-build:
    # T5.1: build the production image from a bare checkout. The gitignored
    # model assets (artifacts/onnx, artifacts/checkpoints) are absent here;
    # the image must still build and boot in "models not ready" mode —
    # this is the documented degradation contract (see Dockerfile header),
    # and it exercises the exact production Dockerfile, not a CI variant.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t steel-defect-lab:ci .

      - name: Boot container and probe endpoints
        run: |
          docker run -d --name sdl-ci \
            -e PRELOAD_MODELS=1 \
            -e RATE_LIMIT_ENABLED=1 \
            -p 127.0.0.1:7860:7860 \
            steel-defect-lab:ci
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:7860/api/v1/health && break
            sleep 2
          done
          echo
          # Health must report ok with zero preloaded models (no assets)
          curl -fsS http://127.0.0.1:7860/api/v1/health
          echo
          # Single-container SPA: index.html served at /
          curl -fsS http://127.0.0.1:7860/ | grep -q '<div id="root">'
          # Registry lists the 4 metrics-known models, all unavailable
          curl -fsS http://127.0.0.1:7860/api/v1/models
          echo
          curl -fsS http://127.0.0.1:7860/api/v1/models > /tmp/models.json
          grep -q '"count": 4' /tmp/models.json
          [ "$(grep -o '"available": false' /tmp/models.json | wc -l)" = "4" ]
          # Predict answers 503 model_not_ready with the JSON envelope
          status=$(curl -s -o /tmp/predict.json -w '%{http_code}' \
            -F "file=@backend/app/assets/samples/crazing/crazing_11.jpg" \
            http://127.0.0.1:7860/api/v1/predict)
          echo "predict status: $status"
          [ "$status" = "503" ] || { cat /tmp/predict.json; exit 1; }
          grep -q '"code": *"model_not_ready"' /tmp/predict.json

      - name: Container logs on failure
        if: failure()
        run: docker logs sdl-ci

      - name: Remove container
        if: always()
        run: docker rm -f sdl-ci || true
