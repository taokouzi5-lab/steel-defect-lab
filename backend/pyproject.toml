[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steel-defect-lab-backend"
version = "0.1.0"
description = "Backend inference, explainability (Grad-CAM) and carbon-estimation services for DefectLens"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "numpy>=1.24",
    "Pillow>=9.0",
    # Pinned exactly: onnxruntime 1.21+ Windows wheels fail to import on the
    # dev machine (DLL init error) — see training/pyproject.toml.
    "onnxruntime==1.20.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.18",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "httpx>=0.27",
    "bandit>=1.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The combined suite (`pytest backend/tests training/tests` from the repo
# root) resolves rootdir to the FIRST argument's project, so this project's
# pythonpath must also expose the training package; with `training/tests`
# first, training's own pythonpath covers it instead.
pythonpath = [".", "../training"]
addopts = "-ra"
markers = [
    "slow: long-running tests (real checkpoint Grad-CAM regression, model preload)",
    "unit: pure-function tests without app or artifact dependencies",
    "integration: TestClient tests against the assembled FastAPI app",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
